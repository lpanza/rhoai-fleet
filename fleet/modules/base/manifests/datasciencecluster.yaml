# One DataScienceCluster per cluster, owned by one policy. Each component is
# switched on by a capability label on the ManagedCluster, resolved on the hub
# with ACM hub templates. Adding or removing a label flips Managed <-> Removed.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    # ---- always on -------------------------------------------------------
    dashboard:
      managementState: Managed

    # ---- training: ai.fleet/training=true ---------------------------
    workbenches:
      managementState: '{{hub if eq (index .ManagedClusterLabels "ai.fleet/training") "true" hub}}Managed{{hub else hub}}Removed{{hub end hub}}'
    aipipelines:
      managementState: '{{hub if eq (index .ManagedClusterLabels "ai.fleet/training") "true" hub}}Managed{{hub else hub}}Removed{{hub end hub}}'
    ray:
      managementState: '{{hub if eq (index .ManagedClusterLabels "ai.fleet/training") "true" hub}}Managed{{hub else hub}}Removed{{hub end hub}}'
    trainingoperator:
      managementState: '{{hub if eq (index .ManagedClusterLabels "ai.fleet/training") "true" hub}}Managed{{hub else hub}}Removed{{hub end hub}}'
    # Kueue is provided by the Red Hat build of Kueue operator, so RHOAI uses
    # "Unmanaged" (integrate) rather than "Managed".
    kueue:
      managementState: '{{hub if eq (index .ManagedClusterLabels "ai.fleet/training") "true" hub}}Unmanaged{{hub else hub}}Removed{{hub end hub}}'

    # ---- inference: ai.fleet/inference=true -------------------------
    kserve:
      managementState: '{{hub if eq (index .ManagedClusterLabels "ai.fleet/inference") "true" hub}}Managed{{hub else hub}}Removed{{hub end hub}}'

    # ---- shared: on if the cluster trains OR serves -----------------------
    modelregistry:
      managementState: '{{hub if or (eq (index .ManagedClusterLabels "ai.fleet/training") "true") (eq (index .ManagedClusterLabels "ai.fleet/inference") "true") hub}}Managed{{hub else hub}}Removed{{hub end hub}}'

    # ---- explicitly off (keeps the DSC deterministic) ---------------------
    feastoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
    mlflowoperator:
      managementState: Removed
    ogx:
      managementState: Removed
    llamastackoperator:
      managementState: Removed
