# GPU option in the dashboard: workbenches and jobs that pick it request
# nvidia.com/gpu and are admitted through the LocalQueue "gpu".
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: gpu-h100
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/display-name: NVIDIA H100
    opendatahub.io/description: 1-8 NVIDIA H100 80GB GPUs, admitted through the Kueue queue "gpu".
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: "[]"
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      resourceType: CPU
      minCount: 1
      defaultCount: 4
      maxCount: 24
    - identifier: memory
      displayName: Memory
      resourceType: Memory
      minCount: 4Gi
      defaultCount: 16Gi
      maxCount: 96Gi
    - identifier: nvidia.com/gpu
      displayName: GPU
      resourceType: Accelerator
      minCount: 1
      defaultCount: 1
      maxCount: 8
  scheduling:
    type: Queue
    kueue:
      localQueueName: gpu
