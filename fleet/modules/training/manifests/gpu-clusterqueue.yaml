# GPU queue. Non-preemptive like "default", so GPU workbenches are allowed
# (RHOAI only admits workbenches through non-preemptive queues).
# Quota = one 8x H100 node; cpu/memory sized to what that node has free.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: nvidia-h100
          resources:
            - name: cpu
              nominalQuota: "24"
            - name: memory
              nominalQuota: 96Gi
            - name: nvidia.com/gpu
              nominalQuota: "8"
