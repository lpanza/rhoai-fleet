# General-purpose CPU queue. Workbenches can't be suspended, so RHOAI only
# admits them through a NON-preemptive queue: preemption is off explicitly.
# The quota is an admission ceiling, not a reservation: size it at or below
# what the cluster's workers have free.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: default
spec:
  namespaceSelector: {}       # any namespace Kueue manages
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: 32Gi
