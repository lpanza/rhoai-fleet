# Must be "gpu-operator": the fake nvidia-smi hard-codes topology-server.gpu-operator.
# The device plugin and DCGM exporter are privileged DaemonSets with hostPath
# mounts. The chart's RBAC grants their ServiceAccounts the privileged SCC;
# Pod Security Admission must allow it too.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    security.openshift.io/scc.podSecurityLabelSync: "false"
