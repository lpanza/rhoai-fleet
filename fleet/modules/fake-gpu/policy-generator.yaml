apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: rhoai-fake-gpu
placementBindingDefaults:
  name: rhoai-fake-gpu
policyDefaults:
  namespace: rhoai-policies
  remediationAction: enforce
  severity: medium
  categories: ["CM Configuration Management"]
  controls: ["CM-2 Baseline Configuration"]
  standards: ["NIST SP 800-53"]
  placement:
    placementName: rhoai-fake-gpu   # rhoai=true AND gpu=fake AND fake-gpu-node set
policies:
  # Simulated NVIDIA GPUs (run-ai/fake-gpu-operator 0.2.1). Labs and demos
  # only; mutually exclusive with the real NVIDIA GPU Operator (part 4).
  # One ConfigurationPolicy holds the whole rendered chart: 27 objects don't
  # need 27 ordered templates. A lab fixture, so removing the label deletes
  # everything the policy created.
  - name: rhoai-fake-gpu-operator
    consolidateManifests: true
    pruneObjectBehavior: DeleteIfCreated
    manifests:
      - path: manifests/namespace.yaml
      - path: manifests/fake-gpu-operator.yaml   # generated by render.sh

  # Label the chosen node once the operator is in place. Never delete the
  # Node on cleanup (default pruneObjectBehavior: None); only the label was ours.
  - name: rhoai-fake-gpu-node
    dependencies:
      - name: rhoai-fake-gpu-operator
    manifests:
      - path: manifests/gpu-node.yaml
        name: fake-gpu-node
